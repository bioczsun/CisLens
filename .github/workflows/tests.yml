name: CPU checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-22.04
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install pip==25.3 setuptools==75.6.0 wheel==0.45.1
      - run: python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -c requirements/lock-linux-py311-cpu.txt ".[prepare,dev]"
      - run: python -m pip check
      - run: ruff check src tests
      - run: python -m pytest -q
      - run: cislens smoke --output-dir "${{ runner.temp }}/cislens-smoke"
      - run: python -m build
