[build-system]
requires = ["setuptools==75.6.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "cislens"
version = "0.1.0"
description = "Sequence and ATAC/DNase models for epigenomic and local Hi-C prediction"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "torch>=2.5.1,<2.6", "numpy>=1.24,<1.27", "pandas>=2.2,<2.3",
  "h5py>=3.11,<3.12", "scipy>=1.10,<1.11", "scikit-image>=0.24,<0.25",
  "einops>=0.7,<0.8", "pyBigWig>=0.3.22,<0.4",
]

[project.optional-dependencies]
prepare = ["pyfaidx>=0.8,<0.9", "cooler>=0.10,<0.11"]
dev = ["pytest>=7.4,<8", "build>=1,<2", "ruff>=0.8,<0.9"]

[project.scripts]
cislens = "cislens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
license-files = ["THIRD_PARTY_NOTICES.md", "LICENSES/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E741"]
